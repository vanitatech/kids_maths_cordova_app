# Insert inside the existing vanitatech.co.uk HTTPS server block.
location = /demos/kids-maths {
    return 301 /demos/kids-maths/;
}

location ^~ /demos/kids-maths/ {
    alias /var/www/kids-maths/current/;
    index index.html;
    autoindex off;
    open_file_cache off;
    expires off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none';" always;
}
