name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:vendor
      - run: npm audit --omit=dev
      - run: npm test
      - name: Build browser-only release
        run: npm run build:browser
        env:
          RELEASE_SHA: ${{ github.sha }}
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser
        env:
          MATHS_PREVIEW_ROOT: dist/site

  image:
    name: Package browser release (publish on main)
    needs: browser-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ghcr.io/vanitatech/kids_maths_cordova_app:${{ github.sha }}
          build-args: RELEASE_SHA=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    name: Deploy Maths Kids to EC2
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.MATHS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: kids-maths-production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-north-1
      AWS_DEFAULT_REGION: eu-north-1
      AWS_PAGER: ""
      INSTANCE_ID: i-019b5c487c103508a
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::451195512799:role/github-deploy-kids-maths
          aws-region: eu-north-1
          role-session-name: kids-maths-${{ github.run_id }}
      - name: Deploy checked release and wait for the server result
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          command_id=$(aws ssm send-command \
            --document-name Vanitatech-DeployKidsMaths \
            --document-version '1' \
            --instance-ids "$INSTANCE_ID" \
            --parameters "CommitSha=$COMMIT_SHA" \
            --timeout-seconds 600 \
            --query Command.CommandId --output text --no-cli-pager)
          echo "Systems Manager command: $command_id"
          bash deploy/wait-for-command.sh "$command_id" "$INSTANCE_ID"
