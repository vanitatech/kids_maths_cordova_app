<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content:;">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="css/index.css">
    <title>Kids Maths App</title>
</head>

<body>
    <div id="app">
        <div id="header">
            <button id="home-button">
                <img src="img/home.svg">
            </button>
            <div id="progress-background">
                <div id="progress-bar"></div>
                <div id="progress-numbers">
                    <span id="progress-numbers-count"></span>/<span id="progress-numbers-total"></span>
                </div>
            </div>
            <button id="progress-stars-button">
                <img src="img/star-yellow.svg">
                <span id="progress-stars-amount"></span>
            </button>
        </div>

        <div id="app-views">
            <div id="lesson-view">
                <div class="mascot-header">
                    <div class="mascot-img mascot-img-left"></div>

                    <div class="mascot-speech mascot-speech-right">
                        <span>Lesson</span>
                        <span id="current-lesson-number" class="lesson-number"></span>
                    </div>
                </div>

                <div id="activities-list"></div>

                <div id="next-lesson-button-container"></div>
            </div>

            <div id="activity-view">
                <div class="mascot-header">
                    <div class="mascot-speech mascot-speech-left">
                        <div class="mascot-speech-part">
                            <span>Let's Learn</span>
                            <span id="activity-type"></span>
                        </div>

                        <div class="mascot-speech-part">
                            <div id="activity-icon"></div>
                        </div>
                    </div>

                    <div class="mascot-img mascot-img-right"></div>
                </div>

                <div id="activity-content"></div>

                <div id="activity-progress">
                    <div>Score</div>
                    <ul id="activity-progress-stars"></ul>
                </div>
            </div>

            <div id="mascot-library-view">
                <div class="mascot-header">
                    <div class="mascot-img mascot-img-left"></div>

                    <div class="mascot-speech mascot-speech-right">
                        <div class="mascot-speech-part">Yahoo! Unlock new friends</div>
                        <div class="mascot-speech-part">
                            <img src="img/unlock-keyhole.svg">
                        </div>
                    </div>
                </div>

                <div id="mascots-list"></div>
            </div>
        </div>
    </div>
    <script src="cordova.js"></script>
    <script type="module" src="js/index.js"></script>
</body>

</html>
