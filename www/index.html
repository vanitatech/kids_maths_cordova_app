<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content:;">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="css/index.css">
    <title>Kids Maths App</title>
</head>

<body>
    <div id="loading">
        <img src="img/spinner.svg" alt="Loading...">
    </div>

    <div id="app">
        <div id="header">
            <button id="home-button" class="show-view-button active" data-target-view="lesson"
                onclick="AppController.showView('lesson')">
                <img src="img/home.svg">
            </button>

            <div id="progress-background">
                <div id="progress-bar"></div>
                <div id="progress-numbers">
                    <span id="progress-numbers-count"></span>/<span id="progress-numbers-total"></span>
                </div>
            </div>

            <button id="progress-stars-button" class="show-view-button" data-target-view="mascot-library"
                onclick="AppController.showView('mascot-library')">
                <img src="img/star-yellow.svg">
                <span id="progress-stars-amount"></span>
            </button>
        </div>

        <div id="app-views">
            <div id="lesson-view" class="app-view" data-view="lesson">
                <div class="mascot-header">
                    <div class="mascot-img-container mascot-img-left"></div>

                    <div class="mascot-speech mascot-speech-right">
                        <span>Lesson</span>
                        <span id="current-lesson-number" class="lesson-number"></span>
                    </div>
                </div>

                <div id="activities-list"></div>

                <div id="worksheets-list"></div>

                <div id="next-lesson-button-container"></div>

                <button id="reset-open" onclick="AppController.showReset();">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 25 25">
                        <path
                            d="m4.56 13.5-.42.43.43.42.42-.43-.43-.42Zm5.36 2.42 6-6-.84-.84-6 6 .84.84Zm-.84-6 6 6 .84-.84-6-6-.84.84ZM19.9 12.5a7.4 7.4 0 0 1-7.4 7.4v1.2a8.6 8.6 0 0 0 8.6-8.6h-1.2Zm-14.8 0a7.4 7.4 0 0 1 7.4-7.4V3.9a8.6 8.6 0 0 0-8.6 8.6h1.2Zm7.4-7.4a7.4 7.4 0 0 1 7.4 7.4h1.2a8.6 8.6 0 0 0-8.6-8.6v1.2Zm-7.34 8.33c-.04-.3-.06-.62-.06-.93H3.9c0 .36.02.72.07 1.07l1.19-.14Zm7.34 6.47a7.4 7.4 0 0 1-6.12-3.24l-1 .68a8.6 8.6 0 0 0 7.12 3.76v-1.2ZM5 13.92l2.43-2.5-.86-.84-2.44 2.5.86.84Zm-.02-.85-2.56-2.5-.84.86 2.56 2.5.84-.86Z"
                            fill="#ffffff" />
                    </svg>
                </button>
            </div>

            <div id="activity-view" class="app-view" data-view="activity">
                <div class="mascot-header">
                    <div class="mascot-speech mascot-speech-left">
                        <div class="mascot-speech-part">
                            <span>Let's Learn</span>
                            <span id="activity-type"></span>
                        </div>

                        <div class="mascot-speech-part">
                            <div id="activity-icon"></div>
                        </div>
                    </div>

                    <div class="mascot-img-container mascot-img-right"></div>
                </div>

                <div id="activity-content" class="card-dragging-zone"></div>

                <div id="activity-progress">
                    <div>Score</div>
                    <ul id="activity-progress-stars"></ul>
                </div>
            </div>

            <div id="mascot-library-view" class="app-view" data-view="mascot-library">
                <div class="mascot-header">
                    <div class="mascot-img-container mascot-img-left"></div>

                    <div class="mascot-speech mascot-speech-right">
                        <div class="mascot-speech-part">Yahoo! Unlock new friends</div>
                        <div class="mascot-speech-part">
                            <img id="mascot-unlock-img" src="img/unlock-keyhole.svg">
                        </div>
                    </div>
                </div>

                <div id="mascots-list"></div>
            </div>

            <div id="reset-check-cover">
                <div id="reset-check">
                    <button id="reset-cancel" onclick="AppController.cancelReset();">
                        <svg xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 512 512">
                            <path
                                d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM175 175c9.4-9.4 24.6-9.4 33.9 0l47 47 47-47c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9l-47 47 47 47c9.4 9.4 9.4 24.6 0 33.9s-24.6 9.4-33.9 0l-47-47-47 47c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9l47-47-47-47c-9.4-9.4-9.4-24.6 0-33.9z" />
                        </svg>
                    </button>
                    <label id="reset-question">5 x 3</label>
                    <input type="number" id="reset-answer" step="1" min="0">
                    <button id="reset-confirm" onclick="AppController.confirmReset();">RESET</button>
                </div>
            </div>
        </div>
    </div>
    <script src="cordova.js"></script>
    <script src="js/lib/dexie.min.js"></script>
    <script type="module" src="js/index.js"></script>
</body>

</html>
